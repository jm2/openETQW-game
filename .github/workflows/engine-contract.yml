# SPDX-License-Identifier: MIT
#
# Engine contract: build the companion engine (jm2/openETQW) at the commit
# pinned in tools/ci/engine.ref against THIS game checkout and run the engine's
# asset-free unit tests (BitMsg, usercmd delta/history, struct-layout ABI
# asserts, zero-SDK audit), which compile staged game headers and link this
# checkout's idLib.
#
# Cross-repo access policy: anonymous https first, then the optional secret
# OPENETQW_CROSS_REPO_TOKEN (only if it is set). While the engine repository
# is private and no token is configured, the resolve job reports
#   "companion repo not accessible - skipped until repos are public"
# as a notice and in the job summary, the contract jobs are skipped and the
# workflow succeeds. Once the repositories are public it runs automatically,
# with no edits. Optional repository variable OPENETQW_ENGINE_CONTRACT_REQUIRED
# = 'true' turns "not accessible" into a failure (use it after going public).
# Update the pin with: python3 tools/ci/bump_engine.py --remote main

name: Engine Contract

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: "Engine commit SHA, branch or tag to test instead of the pin in tools/ci/engine.ref (blank = pin)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: engine-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  MESON_SPEC: "meson>=1.6.0,<2"
  NINJA_SPEC: "ninja>=1.11"
  PYTHONUTF8: "1"
  # Engine tests that must run and pass (tools/ci/check_engine_tests.py).
  ENGINE_UNIT_TESTS: bitmsg,usercmd-delta,struct-layout,usercmd-history,zero-sdk

jobs:
  resolve:
    name: Resolve companion engine
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      available: ${{ steps.probe.outputs.available }}
      sha: ${{ steps.probe.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Probe engine repository (anonymous https first)
        id: probe
        env:
          OPENETQW_CROSS_REPO_TOKEN: ${{ secrets.OPENETQW_CROSS_REPO_TOKEN }}
          ENGINE_REF: ${{ inputs.engine_ref }}
          CONTRACT_REQUIRED: ${{ vars.OPENETQW_ENGINE_CONTRACT_REQUIRED }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          status=0
          python3 tools/ci/fetch_engine.py --probe --ref "${ENGINE_REF}" --github-output \
            --record .tmp/ci/engine-probe.json || status=$?
          if [ "${status}" -eq 78 ]; then
            # Not accessible: dependent jobs skip cleanly (see header comment).
            if [ "${CONTRACT_REQUIRED}" = "true" ]; then
              echo "::error title=Engine contract required::companion repo not accessible but OPENETQW_ENGINE_CONTRACT_REQUIRED=true"
              exit 1
            fi
            if [ "${REPO_PRIVATE}" = "false" ]; then
              echo "::warning title=Engine contract skipped::this repository is public but the engine repository is not reachable anonymously; check tools/ci/engine.ref"
            fi
            exit 0
          fi
          exit "${status}"

  contract:
    name: Engine contract ${{ matrix.name }}
    needs: resolve
    if: needs.resolve.outputs.available == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64-gcc
            name: Linux x64 (GCC)
            runner: ubuntu-24.04
            os: linux
            arch: x64
            cc: gcc
            cxx: g++
            buildtype: release
            sanitize: none
            experimental: false
          - id: linux-x64-clang
            name: Linux x64 (Clang)
            runner: ubuntu-24.04
            os: linux
            arch: x64
            cc: clang
            cxx: clang++
            buildtype: release
            sanitize: none
            experimental: false
          - id: macos-arm64
            name: macOS arm64 (Apple Clang)
            runner: macos-15
            os: macos
            arch: arm64
            cc: clang
            cxx: clang++
            buildtype: release
            sanitize: none
            experimental: false
          # ASan+UBSan idLib/game module linked into sanitized engine tests.
          # Easy flag: set experimental to false once it has been green.
          - id: linux-x64-clang-asan-ubsan
            name: Linux x64 ASan+UBSan (Clang)
            runner: ubuntu-24.04
            os: linux
            arch: x64
            cc: clang
            cxx: clang++
            buildtype: debugoptimized
            sanitize: address,undefined
            experimental: true
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CI_OS: ${{ matrix.os }}
      CI_ARCH: ${{ matrix.arch }}
      CI_BUILDTYPE: ${{ matrix.buildtype }}
      CI_SANITIZE: ${{ matrix.sanitize }}
      CI_LEG: ${{ matrix.name }}
      # Engine checkout sits next to this one, matching the engine's default
      # ../openETQW-game discovery; OPENETQW_GAME_REPO makes it explicit.
      ENGINE_DIR: ${{ github.workspace }}/../openETQW
      OPENETQW_GAME_REPO: ${{ github.workspace }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:report_error_type=1
    steps:
      - name: Checkout game
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Meson and Ninja
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "${MESON_SPEC}" "${NINJA_SPEC}"

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          packages=(zlib1g-dev pkg-config)
          if [ "${CC}" = clang ]; then packages+=(clang); fi
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends "${packages[@]}"; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed; retrying in 15 seconds"
            sleep 15
          done
          echo "Failed to install ${packages[*]}" >&2
          exit 1

      - name: Fetch engine
        id: engine
        env:
          OPENETQW_CROSS_REPO_TOKEN: ${{ secrets.OPENETQW_CROSS_REPO_TOKEN }}
          ENGINE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          status=0
          python tools/ci/fetch_engine.py --ref "${ENGINE_SHA}" --dest "${ENGINE_DIR}" --github-output \
            --record .tmp/ci/engine-fetch.json || status=$?
          if [ "${status}" -eq 78 ]; then
            exit 0  # lost access since the resolve job: later steps skip (available=false)
          fi
          exit "${status}"

      # Experimental legs use step-level continue-on-error: failures are reported
      # (warning + job summary) but the job still concludes 'success'.
      - name: Build game (idLib + module)
        id: game
        if: steps.engine.outputs.available == 'true'
        continue-on-error: ${{ matrix.experimental }}
        run: |
          set -euo pipefail
          # The engine links <game repo>/build/libidLib.a, so the build dir is 'build'.
          args=(setup build . --backend ninja --buildtype "${CI_BUILDTYPE}")
          if [ "${CI_SANITIZE}" != none ]; then
            args+=("-Db_sanitize=${CI_SANITIZE}" -Db_lundef=false)
          fi
          meson "${args[@]}"
          python tools/ci/run_logged.py --log .tmp/ci/compile-game.log --paths-from build -- meson compile -C build --ninja-args=-k,25
          check=(--build-dir build --os "${CI_OS}" --arch "${CI_ARCH}" --report .tmp/ci/module-report.json)
          if [ "${CI_OS}" = linux ]; then check+=(--exports warn); fi
          if [ "${CI_SANITIZE}" != none ]; then check+=(--expect-sanitizer); else check+=(--load-smoke); fi
          python tools/ci/check_game_module.py "${check[@]}"

      - name: Stage game headers into the engine
        id: stage
        if: steps.game.outcome == 'success'
        continue-on-error: ${{ matrix.experimental }}
        run: |
          set -euo pipefail
          python "${ENGINE_DIR}/tools/build/stage_game.py" "${ENGINE_DIR}" "${GITHUB_WORKSPACE}" "${ENGINE_DIR}/.tmp/gamelibs_stage"
          cp "${ENGINE_DIR}/.tmp/gamelibs_stage/openetqw_gamelibs_stage_manifest.json" .tmp/ci/

      - name: Build engine unit tests
        id: engine_build
        if: steps.stage.outcome == 'success'
        continue-on-error: ${{ matrix.experimental }}
        run: |
          set -euo pipefail
          args=(setup "${ENGINE_DIR}/build" "${ENGINE_DIR}" --backend ninja --buildtype "${CI_BUILDTYPE}"
                -Dbuild_engine=false -Dbuild_dedicated=false -Dbuild_tests=true)
          if [ "${CI_SANITIZE}" != none ]; then
            args+=("-Db_sanitize=${CI_SANITIZE}")
          fi
          meson "${args[@]}"
          python tools/ci/run_logged.py --log .tmp/ci/compile-engine.log --paths-from "${ENGINE_DIR}/build" -- meson compile -C "${ENGINE_DIR}/build" --ninja-args=-k,25

      - name: Run engine unit tests (asset-free)
        id: tests
        if: steps.engine_build.outcome == 'success'
        continue-on-error: ${{ matrix.experimental }}
        run: |
          set -euo pipefail
          # Hosted runners have no retail data; unit tests must not need it.
          unset ETQW_DATA_PATH
          status=0
          meson test -C "${ENGINE_DIR}/build" --suite unit --print-errorlogs --num-processes 2 || status=$?
          scan=()
          if [ "${CI_SANITIZE}" != none ]; then scan+=(--scan-sanitizer); fi
          # testlog.* embed the whole environment, so only this sanitised report is published.
          python tools/ci/check_engine_tests.py "${ENGINE_DIR}/build/meson-logs/testlog.json" \
            --require "${ENGINE_UNIT_TESTS}" --report .tmp/ci/engine-tests.json --label "${CI_LEG}" ${scan[@]+"${scan[@]}"}
          exit "${status}"

      - name: Collect engine configure log
        if: always() && steps.engine.outputs.available == 'true'
        run: |
          set -euo pipefail
          mkdir -p .tmp/ci
          if [ -f "${ENGINE_DIR}/build/meson-logs/meson-log.txt" ]; then
            cp "${ENGINE_DIR}/build/meson-logs/meson-log.txt" .tmp/ci/engine-meson-log.txt
          fi

      - name: Publish contract logs
        if: always() && steps.engine.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: engine-contract-${{ matrix.id }}
          path: |
            build/meson-logs/meson-log.txt
            .tmp/ci/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true

      - name: Report contract outcome
        if: always()
        env:
          AVAILABLE: ${{ steps.engine.outputs.available }}
          ENGINE_SHORT: ${{ steps.engine.outputs.short_sha }}
          EXPERIMENTAL: ${{ matrix.experimental }}
          STAGES: "game=${{ steps.game.outcome }} stage=${{ steps.stage.outcome }} engine=${{ steps.engine_build.outcome }} tests=${{ steps.tests.outcome }}"
          TESTS: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          if [ "${AVAILABLE}" != true ]; then
            echo "### Engine contract ${CI_LEG}: skipped (companion repo not accessible)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          mode=required
          if [ "${EXPERIMENTAL}" = true ]; then mode="experimental, not blocking"; fi
          if [ "${TESTS}" = success ]; then
            echo "### Engine contract ${CI_LEG} @ ${ENGINE_SHORT} (${mode}): passed" >> "${GITHUB_STEP_SUMMARY}"
          else
            if [ "${EXPERIMENTAL}" = true ]; then
              echo "::warning title=Experimental engine contract failed (not blocking)::${CI_LEG}: ${STAGES}"
            fi
            echo "### :warning: Engine contract ${CI_LEG} @ ${ENGINE_SHORT} (${mode}): failed (${STAGES})" >> "${GITHUB_STEP_SUMMARY}"
          fi

  result:
    name: Engine Contract result
    if: always()
    needs: [resolve, contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate
        env:
          RESOLVE: ${{ needs.resolve.result }}
          CONTRACT: ${{ needs.contract.result }}
          AVAILABLE: ${{ needs.resolve.outputs.available }}
        run: |
          set -euo pipefail
          if [ "${RESOLVE}" != success ]; then
            echo "Resolving the companion engine failed (${RESOLVE}); see the resolve job."
            exit 1
          fi
          if [ "${AVAILABLE}" != true ]; then
            echo "### Engine Contract: skipped (companion repo not accessible - skipped until repos are public)" >> "${GITHUB_STEP_SUMMARY}"
            echo "companion repo not accessible - skipped until repos are public"
            exit 0
          fi
          if [ "${CONTRACT}" != success ]; then
            echo "Engine contract jobs: ${CONTRACT}"
            exit 1
          fi
          echo "### Engine Contract: passed" >> "${GITHUB_STEP_SUMMARY}"
