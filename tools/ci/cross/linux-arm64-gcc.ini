# SPDX-License-Identifier: MIT
#
# Meson cross file for the Linux ARM64 cross leg of commit-validation.yml
# (x64 ubuntu-24.04 host, Ubuntu package g++-aarch64-linux-gnu). Mirrors the
# openQ4 linux-arm64-cross.yml pattern: ARM64 compile/link coverage that does
# not need the hosted ARM64 runners (which private repositories do not get).
#   meson setup build . --cross-file tools/ci/cross/linux-arm64-gcc.ini

[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
